<svg
xmlns="http://www.w3.org/2000/svg"
xml:space="preserve"
width="560"
height="650"
viewBox="0 0 560 650">

<rect
width="100%"
height="100%"
fill="#0d1117"/>

<style>

.ascii {
    font-family: "Courier New", monospace;
    font-size: 10px;
    font-weight: 600;
    fill: #c9d1d9;
    white-space: pre;
}

.row {
    opacity: 0;
    animation:
        appear 0.18s ease-out forwards;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateX(-10px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

