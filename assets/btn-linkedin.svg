  <style>
    @keyframes shine-sweep {
      0% { transform: translateX(-140px) skewX(-22deg); opacity: 0; }
      10% { opacity: 1; }
      35% { transform: translateX(460px) skewX(-22deg); opacity: 0.9; }
      40%, 100% { transform: translateX(460px) skewX(-22deg); opacity: 0; }
    }
    .shine { animation: shine-sweep 4s ease-in-out infinite; }
