<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The Cartographer profile card for Manish Chandra Raturi">
  <defs>
    <pattern id="grid-paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5dcc8" stroke-width="1"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="900" height="300" rx="18"/>
    </clipPath>
    <clipPath id="avatar-clip">
      <circle cx="718" cy="166" r="66"/>
    </clipPath>
  </defs>

  <!-- Cream Grid-Paper Background -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="900" height="300" fill="#faf5ea"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#grid-paper)"/>
  </g>

  <!-- Outer Subtle Border & Dashed Inner Border -->
  <rect x="1" y="1" width="898" height="298" rx="18" fill="none" stroke="#dfd4bc" stroke-width="1.5"/>
  <rect x="16" y="16" width="868" height="268" rx="12" fill="none" stroke="#cbbda0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Left Content -->
  <text x="48" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#c93b2b">&#9670; THE CARTOGRAPHER</text>
  <text x="48" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f233c" letter-spacing="-0.6">Manish Chandra Raturi</text>
  
  <text x="48" y="196" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="500" fill="#334155">1 follower · 25 repos</text>

  <!-- Top-Right Red Compass -->
  
  <g transform="translate(832, 62)">
    <circle cx="0" cy="0" r="24" fill="#faf5ea" fill-opacity="0.85" stroke="#c93b2b" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#c93b2b" stroke-width="0.6" stroke-opacity="0.45" stroke-dasharray="2 2"/>
    <!-- Cardinal ticks -->
    <line x1="0" y1="-24" x2="0" y2="-20" stroke="#c93b2b" stroke-width="1.4"/>
    <line x1="0" y1="20" x2="0" y2="24" stroke="#c93b2b" stroke-width="1.4"/>
    <line x1="-24" y1="0" x2="-20" y2="0" stroke="#c93b2b" stroke-width="1.4"/>
    <line x1="20" y1="0" x2="24" y2="0" stroke="#c93b2b" stroke-width="1.4"/>
    <!-- Compass needle -->
    <polygon points="0,-16 4.5,0 0,-2.5" fill="#c93b2b"/>
    <polygon points="0,-16 -4.5,0 0,-2.5" fill="#e06558"/>
    <polygon points="0,16 4.5,0 0,2.5" fill="#e8b4ae"/>
    <polygon points="0,16 -4.5,0 0,2.5" fill="#f3d5d1"/>
    <polygon points="-13,0 0,-3.2 0,3.2" fill="#c93b2b" fill-opacity="0.35"/>
    <polygon points="13,0 0,-3.2 0,3.2" fill="#c93b2b" fill-opacity="0.55"/>
    <circle cx="0" cy="0" r="2.2" fill="#faf5ea" stroke="#c93b2b" stroke-width="1.2"/>
  </g>

  <!-- Right Circular Avatar with Red Border -->
  <circle cx="718" cy="166" r="72" fill="none" stroke="#c93b2b" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="4 3"/>
  <image href="data:image/jpeg;base64," x="652" y="100" width="132" height="132" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="718" cy="166" r="66" fill="none" stroke="#c93b2b" stroke-width="3.5"/>
</svg>
