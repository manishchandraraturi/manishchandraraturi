name: Update Profile Art

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm --prefix scripts ci

      - name: Build profile stats, SVGs, and README
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npm --prefix scripts run build

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ data/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile assets and README [skip ci]"
          git push
